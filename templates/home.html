<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DocuMind</title>
</head>
<body>
    <h1>Welcome to DocuMind</h1>
    <a href="/upload">Upload Documents</a>
    {% if documents %}
    <ul>
        {% for doc in documents %}
        <li>{{ doc }}</li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No documents uploaded yet.</p>
    {% endif %}
</body>
</html>
